<!doctype html>
<html lang="zh-CN" data-atlas-template="codebase-understanding-atlas/v1">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>代码库理解地图</title>
<style>
:root{--ink:#20252b;--muted:#586575;--line:#ccd5df;--paper:#f5f7f9;--panel:#fff;--top:#242b2f;--hero:#17283b;--hero2:#233d5a;--blue:#0969da;--soft:#dff2ff;--softline:#80ccff;--shadow:0 18px 55px #0d20352b;--radius:10px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}button,input{font:inherit}button{cursor:pointer}.topbar{height:56px;padding:0 14px;display:flex;align-items:center;gap:16px;background:var(--top);color:#fff;position:sticky;top:0;z-index:20}.brand{font-weight:750;font-size:17px;white-space:nowrap}.brand:before{content:"◉";font-size:15px;margin-right:12px}.glossary-btn{border:1px solid #5c6873;background:#364049;color:#fff;border-radius:7px;padding:8px 13px}.search{margin-left:auto;width:min(448px,52vw);border:1px solid #687785;background:#10161c;color:#fff;border-radius:8px;padding:9px 13px;outline:none}.search:focus{border-color:#8ec8ff}.page{padding:22px 12px 40px;max-width:1600px;margin:auto}.hero{background:linear-gradient(115deg,var(--hero),var(--hero2));color:#fff;border-radius:12px;padding:20px;margin-bottom:16px}.hero h1{font-size:25px;margin:0 0 6px}.meta{color:#d7e2ef;margin-bottom:16px}.cap-grid{display:grid;grid-template-columns:repeat(var(--cap-count,5),minmax(0,1fr));gap:8px}.cap-card{border:1px solid #617287;background:#ffffff0d;border-radius:8px;padding:12px;min-height:112px}.cap-card strong{display:block;font-size:16px;margin-bottom:5px}.cap-card p{font-size:13px;line-height:1.65;margin:0;color:#e2e9f1}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.side,.browser,.folder-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.side h2{font-size:15px;padding:14px;margin:0;border-bottom:1px solid var(--line)}.root-list{padding:8px 12px;max-height:calc(100vh - 135px);overflow:auto}.root-item{border:0;background:transparent;display:block;text-align:left;width:100%;padding:7px 0;font-size:12px;line-height:1.35;color:var(--ink)}.root-item:before,.entry-name.dir:before{content:"▰";font-size:8px;margin-right:7px}.content{min-width:0}.crumbs{height:29px;color:var(--blue);font-size:12px;display:flex;align-items:center;gap:5px;overflow:hidden}.crumb{border:0;background:transparent;color:var(--blue);padding:0}.folder-card{background:var(--soft);border-color:var(--softline);padding:13px;margin-bottom:12px}.folder-card strong{display:block;margin-bottom:4px}.folder-card p{margin:0;color:#44566b;line-height:1.55}.browser-head{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.entry{display:grid;grid-template-columns:minmax(210px,1fr) minmax(280px,2fr) 52px;gap:16px;align-items:start;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}.entry:last-child{border-bottom:0}.entry:hover{background:#f6faff}.entry-name{border:0;background:transparent;text-align:left;color:var(--blue);font-weight:700;padding:0;line-height:1.45;overflow-wrap:anywhere}.entry-desc{color:var(--muted);line-height:1.5;overflow-wrap:anywhere}.entry-count{font-size:11px;color:#7b8794;text-align:right}.empty{padding:35px;text-align:center;color:var(--muted)}.overlay{position:fixed;inset:0;background:#0a152388;z-index:40;display:none}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;width:min(760px,94vw);height:100%;overflow:auto;background:#fff;box-shadow:var(--shadow);padding:22px}.close{float:right;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px}.drawer h2,.modal h2{margin:0 0 5px}.purpose{font-size:16px;line-height:1.75;background:var(--soft);border:1px solid var(--softline);border-radius:8px;padding:13px;margin:15px 0}.facts{color:var(--muted);font-size:13px}.detail-section{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}.detail-section h3{margin:0 0 10px;font-size:16px}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.role{border:1px solid var(--line);border-radius:8px;padding:11px}.role b{display:block;margin-bottom:4px}.tag{display:inline-block;margin-top:7px;border-radius:999px;padding:2px 8px;background:#edf4ff;color:#145fba;font-size:11px}.detail-list{margin:0;padding-left:20px}.detail-list li{margin:7px 0;line-height:1.55}.modal-wrap{display:none;position:fixed;inset:0;background:#0a152388;z-index:50;padding:5vh 14px}.modal-wrap.open{display:block}.modal{max-width:900px;max-height:90vh;overflow:auto;margin:auto;background:#fff;border-radius:11px;padding:22px;box-shadow:var(--shadow)}.glossary-item{padding:12px 0;border-top:1px solid var(--line)}.glossary-item b{color:var(--blue)}@media(max-width:950px){.cap-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.side{display:none}.entry{grid-template-columns:minmax(160px,1fr) 2fr 44px}}@media(max-width:620px){.brand{font-size:14px}.glossary-btn{display:none}.search{width:auto;min-width:0}.page{padding:12px 8px}.hero{padding:15px}.hero h1{font-size:21px}.cap-grid{grid-template-columns:1fr}.entry{grid-template-columns:1fr}.entry-count{display:none}.role-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="atlas-topbar" class="topbar"><div id="brand" class="brand"></div><button id="glossary-open" class="glossary-btn">模块与名词说明</button><input id="search" class="search" aria-label="搜索" placeholder="搜索文件或功能，例如：恢复会话 / agent-loop"></header>
<main class="page"><section id="capability-hero" class="hero"><h1 id="hero-title"></h1><div id="meta" class="meta"></div><div id="capabilities" class="cap-grid"></div></section><div class="workspace"><aside id="top-directory" class="side"><h2>顶层目录</h2><div id="roots" class="root-list"></div></aside><section id="content-panel" class="content"><nav id="crumbs" class="crumbs"></nav><div id="folder-card" class="folder-card"></div><div class="browser"><div class="browser-head"><span id="list-title"></span><span id="list-path"></span></div><div id="entries"></div></div></section></div></main>
<div id="detail-drawer" class="overlay"><article class="drawer"><button class="close" data-close="drawer">关闭</button><div id="detail"></div></article></div>
<div id="glossary-dialog" class="modal-wrap"><section class="modal"><button class="close" data-close="glossary">关闭</button><h2>模块与名词说明</h2><p>先说人话，再保留代码名，避免把术语表做成另一份密码本。</p><div id="glossary"></div></section></div>
<script id="data" type="application/json">__ATLAS_JSON__</script>
<script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('data').textContent),E=D.entries||{},caps=D.capabilities||[],root=E['']||E['.']||Object.values(E).find(x=>x&&x.kind==='dir'&&!String(x.path||'').includes('/'))||{};const repo=D.repository||{},repoName=repo.fullName||repo.name||root.display||root.name||'repository',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),children=p=>{const x=E[p]||{};if(Array.isArray(x.children))return x.children.map(c=>E[c]?c:(p?p+'/':'')+c).filter(c=>E[c]);const pre=p?p+'/':'';return Object.keys(E).filter(k=>k.startsWith(pre)&&k!==p&&!k.slice(pre.length).includes('/'))},countFiles=p=>{const pre=p?p+'/':'';return Object.entries(E).filter(([k,v])=>v.kind==='file'&&(k===p||k.startsWith(pre))).length},byType=(a,b)=>(E[a].kind===E[b].kind?String(E[a].display||E[a].name).localeCompare(String(E[b].display||E[b].name),'zh-CN'):E[a].kind==='dir'?-1:1);let current='';document.title=repoName+' · 代码库理解地图';document.getElementById('brand').textContent=repoName;document.getElementById('hero-title').textContent=(repo.title||root.display||repoName)+' 代码库理解地图';const counts=D.counts||{};document.getElementById('meta').textContent=(repo.branch||'')+(repo.branch?'@':'')+String(D.revision||'unknown').slice(0,10)+' · '+(counts.files??Object.values(E).filter(x=>x.kind==='file').length)+' 个文件 · '+(counts.dirs??Object.values(E).filter(x=>x.kind==='dir').length)+' 个文件夹'+(repo.architecture?' · '+repo.architecture:'');const cg=document.getElementById('capabilities');cg.style.setProperty('--cap-count',Math.min(5,Math.max(1,caps.length)));cg.innerHTML=caps.map(c=>'<article class="cap-card"><strong>'+esc(c.name)+'</strong><p>'+esc(c.summary||c.outcome||c.trigger||'')+'</p></article>').join('');function rootButtons(){document.getElementById('roots').innerHTML=children('').filter(p=>E[p].kind==='dir').map(p=>'<button class="root-item" data-path="'+esc(p)+'">'+esc(E[p].display||E[p].name)+' — '+esc(E[p].description||'')+'</button>').join('')}function crumbs(p){const seg=p?p.split('/'):[],arr=[['',root.display||root.name||repoName]];seg.forEach((_,i)=>arr.push([seg.slice(0,i+1).join('/'),E[seg.slice(0,i+1).join('/')]?.display||seg[i]]));document.getElementById('crumbs').innerHTML=arr.map(([x,n],i)=>'<button class="crumb" data-path="'+esc(x)+'">'+esc(n)+'</button>'+(i<arr.length-1?'<span>/</span>':'')).join('')}function render(p,custom){current=p;const x=E[p]||root;crumbs(p);document.getElementById('folder-card').innerHTML='<strong>'+esc(x.display||x.name||repoName)+'</strong><p>'+esc(x.description||'该目录尚无可靠说明。')+'</p>';const list=custom||children(p).sort(byType);document.getElementById('list-title').textContent=custom?list.length+' 个搜索结果':list.length+' 个直接子项';document.getElementById('list-path').textContent=p?'/'+p:'/';document.getElementById('entries').innerHTML=list.length?list.map(path=>{const y=E[path],n=y.display||y.name||path.split('/').pop(),num=y.kind==='dir'?countFiles(path)+' 项':(y.lines?y.lines+' 行':'文件');return '<div class="entry"><button class="entry-name '+y.kind+'" data-'+(y.kind==='dir'?'path':'file')+'="'+esc(path)+'">'+esc(n)+'</button><div class="entry-desc">'+esc(y.description||'')+'</div><div class="entry-count">'+esc(num)+'</div></div>'}).join(''):'<div class="empty">这里没有可显示的条目。</div>';location.hash='/'+encodeURIComponent(p)}const section=(title,body)=>body?'<section class="detail-section"><h3>'+esc(title)+'</h3>'+body+'</section>':'';function openFile(path){const x=E[path],roles=(x.coreRoles||[]).map(r=>'<article class="role"><b>'+esc(r.name)+'</b><div>'+esc(r.description)+'</div><span class="tag">'+esc(r.relation)+'</span></article>').join(''),symbols=(x.symbolDetails||[]).map(s=>'<li><b>'+esc(s.name)+'</b> — '+esc(s.description)+'</li>').join(''),deps=(x.dependencies||[]).map(s=>'<li><b>'+esc(s.display||s.name)+'</b> — '+esc(s.purpose)+'</li>').join(''),tables=(x.tables||[]).map(s=>'<li><b>'+esc(s.display||s.name)+'</b></li>').join(''),routes=(x.routes||[]).map(s=>'<li>'+esc(typeof s==='string'?s:JSON.stringify(s))+'</li>').join(''),tests=(x.tests||[]).map(s=>'<li>'+esc(typeof s==='string'?s:JSON.stringify(s))+'</li>').join('');document.getElementById('detail').innerHTML='<h2>'+esc(x.display||x.name)+'</h2><div class="facts">'+esc(x.ext||'文件')+(x.size?' · '+x.size+' bytes':'')+(x.lines?' · '+x.lines+' 行':'')+'</div><div class="purpose">'+esc(x.description)+'</div>'+section('在核心能力中的角色','<div class="role-grid">'+roles+'</div>')+section('主要声明','<ul class="detail-list">'+symbols+'</ul>')+section('依赖目的','<ul class="detail-list">'+deps+'</ul>')+section('数据与存储','<ul class="detail-list">'+tables+'</ul>')+section('路由','<ul class="detail-list">'+routes+'</ul>')+section('行为测试','<ul class="detail-list">'+tests+'</ul>')+section('源码设计说明',x.sourceComment?'<p>'+esc(x.sourceComment)+'</p>':'');document.getElementById('detail-drawer').classList.add('open')}function glossary(){const mods=Object.entries(D.modules||{}).map(([k,m])=>'<div class="glossary-item"><b>'+esc(m.display||m.name||k)+'</b><div>'+esc(m.owns||m.summary||m.description||'')+'</div>'+(m.usedFor?'<small>其他模块使用它：'+esc(m.usedFor)+'</small>':'')+'</div>');const terms=Array.isArray(D.glossary)?D.glossary.map(t=>'<div class="glossary-item"><b>'+esc(t.code||t.name)+'</b><div>'+esc(t.meaning||t.description)+'</div></div>'):[];document.getElementById('glossary').innerHTML=mods.concat(terms).join('')||'<p>没有可可靠解释的术语。</p>'}document.addEventListener('click',e=>{const b=e.target.closest('[data-path],[data-file],[data-close]');if(!b)return;if(b.dataset.path!==undefined)render(b.dataset.path);if(b.dataset.file)openFile(b.dataset.file);if(b.dataset.close==='drawer')document.getElementById('detail-drawer').classList.remove('open');if(b.dataset.close==='glossary')document.getElementById('glossary-dialog').classList.remove('open')});document.getElementById('glossary-open').onclick=()=>{glossary();document.getElementById('glossary-dialog').classList.add('open')};document.getElementById('detail-drawer').onclick=e=>{if(e.target.id==='detail-drawer')e.currentTarget.classList.remove('open')};document.getElementById('glossary-dialog').onclick=e=>{if(e.target.id==='glossary-dialog')e.currentTarget.classList.remove('open')};document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return render(current);const found=Object.entries(E).filter(([p,x])=>x.kind==='file'&&[p,x.display,x.description,...(x.symbolDetails||[]).flatMap(s=>[s.name,s.description]),...(x.coreRoles||[]).flatMap(r=>[r.name,r.description])].join(' ').toLowerCase().includes(q)).slice(0,200).map(([p])=>p);render('',found)});rootButtons();render(decodeURIComponent(location.hash.replace(/^#\/?/,'')) in E?decodeURIComponent(location.hash.replace(/^#\/?/,'')):'')})();
</script>
