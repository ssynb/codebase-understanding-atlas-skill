(()=>{'use strict';const D=JSON.parse(document.getElementById('data').textContent),E=D.entries||{},C=D.capabilities||[],root=E['']||E['.']||{},R=D.repository||{},full=R.fullName||R.name||root.name||'repository',parts=full.split('/'),owner=parts.length>1?parts[0]:'',repo=parts.at(-1),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),kids=p=>{const x=E[p]||{};if(Array.isArray(x.children))return x.children.map(c=>E[c]?c:(p?p+'/':'')+c).filter(c=>E[c]);const q=p?p+'/':'';return Object.keys(E).filter(k=>k!==p&&k.startsWith(q)&&!k.slice(q.length).includes('/'))},fileCount=p=>{const q=p?p+'/':'';return Object.entries(E).filter(([k,x])=>x.kind==='file'&&(k===p||k.startsWith(q))).length},sort=(a,b)=>E[a].kind===E[b].kind?String(E[a].display||E[a].name).localeCompare(String(E[b].display||E[b].name),'zh-CN'):E[a].kind==='dir'?-1:1;let current='';document.title=full+' · 代码库理解地图';document.getElementById('header-repo').innerHTML=esc(owner)+(owner?' / ':'')+'<b>'+esc(repo)+'</b>';document.getElementById('repo-title').innerHTML=(owner?'<a>'+esc(owner)+'</a> / ':'')+'<a><b>'+esc(repo)+'</b></a>';const counts=D.counts||{},branch=R.branch||'source';document.getElementById('stats').textContent=branch+'@'+String(D.revision||'unknown').slice(0,8)+' · '+(counts.files??0)+' 个文件 · '+(counts.dirs??0)+' 个文件夹';document.getElementById('branch').textContent='⑂ '+branch;function openDrawer(title,html){document.getElementById('drawer-name').textContent=title;document.getElementById('drawer-body').innerHTML=html;document.getElementById('detail-drawer').classList.add('open');document.getElementById('backdrop').classList.add('open')}function close(){document.getElementById('detail-drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}function topDirs(){document.getElementById('side').innerHTML=kids('').filter(p=>E[p].kind==='dir').map(p=>'<button class="side-link" data-path="'+esc(p)+'">▰ '+esc(E[p].display||E[p].name)+'</button>').join('')}function crumbs(p){const seg=p?p.split('/'):[],a=[['',root.display||root.name||repo]];seg.forEach((_,i)=>{const x=seg.slice(0,i+1).join('/');a.push([x,E[x]?.display||seg[i]])});document.getElementById('crumb').innerHTML=a.map(([p,n],i)=>'<button data-path="'+esc(p)+'">'+esc(n)+'</button>'+(i<a.length-1?'<span>/</span>':'')).join('')}function render(p){current=E[p]?.kind==='dir'?p:'';const x=E[current]||root,list=kids(current).sort(sort);crumbs(current);document.getElementById('summary').innerHTML='<b>'+esc(x.display||x.name||repo)+'</b><span>'+esc(x.description||'该目录尚无可靠说明。')+'</span>';document.getElementById('count').textContent=list.length+' 个直接子项';document.getElementById('head').textContent=current?'/'+current:'/';const up=current?current.split('/').slice(0,-1).join('/'):null;document.getElementById('rows').innerHTML=(up!==null?'<div class="row up" data-path="'+esc(up)+'"><div class="name"><span class="icon">↩</span>返回上级</div><div class="desc">回到父目录</div><div class="meta"></div></div>':'')+(list.length?list.map(p=>{const y=E[p],isDir=y.kind==='dir';return '<div class="row" data-'+(isDir?'path':'file')+'="'+esc(p)+'"><div class="name"><span class="icon">'+(isDir?'▰':'▤')+'</span>'+esc(y.display||y.name)+'</div><div class="desc">'+esc(y.description||'')+'</div><div class="meta">'+(isDir?fileCount(p)+' 项':(y.lines?y.lines+' 行':'文件'))+'</div></div>'}).join(''):'<div class="empty">这里没有可显示的条目。</div>');location.hash='/'+encodeURIComponent(current)}const section=(t,b,empty)=>'<section class="detail-section"><h3>'+esc(t)+'</h3>'+(b||'<p class="empty-note">'+esc(empty)+'</p>')+'</section>';function roleClass(r){r=String(r).toLowerCase();return r.includes('direct')||r.includes('直接')?'direct':r.includes('support')||r.includes('支撑')?'support':r.includes('verif')||r.includes('验证')?'verify':'none'}function file(path){const x=E[path],p=x.purpose||{},roles=(x.coreRoles||[]).map(r=>'<div class="core-card"><div class="core-head"><b>'+esc(r.name)+'</b><span class="role '+roleClass(r.relation)+'">'+esc(r.relation)+'</span></div><p>'+esc(r.description)+'</p></div>').join(''),facts='<div class="facts"><div class="fact"><b>'+esc(x.ext||'文件')+'</b><span>文件类型</span></div><div class="fact"><b>'+esc(x.size??'—')+'</b><span>文件大小（字节）</span></div><div class="fact"><b>'+esc(x.lines??'—')+'</b><span>文本行数</span></div></div>',purpose='<div class="purpose"><b>'+esc(p.summary||x.description)+'</b><p><strong>什么时候使用：</strong>'+esc(p.when||'源码没有给出可确认的使用时机。')+'</p><p><strong>输入与结果：</strong>'+esc(p.effect||'源码没有给出可确认的输入输出。')+'</p></div>',symbols=(x.symbolDetails||[]).map(s=>'<li><span class="tag">'+esc(s.kind)+'</span> <code>'+esc(s.name)+'</code>：'+esc(s.description)+'</li>').join(''),deps=(x.dependencies||[]).map(s=>'<li><b>'+esc(s.display||s.name)+'</b>：'+esc(s.purpose)+'</li>').join(''),tables=(x.tables||[]).map(t=>'<li><code>'+esc(t.name)+'</code>（'+esc(t.display)+'） · <b>'+esc(t.access)+'</b>：'+esc(t.purpose)+'</li>').join(''),routes=(x.routes||[]).map(r=>'<li><code>'+esc(r.method)+' '+esc(r.path)+'</code>：'+esc(r.description)+'</li>').join(''),notes=(x.designNotes||[]).map(s=>'<li>'+esc(s)+'</li>').join(''),tests=(x.tests||[]).map(t=>'<li><code>'+esc(t.name)+'</code>：'+esc(t.description)+'</li>').join('');openDrawer(x.display||x.name,section('这个文件主要做什么',purpose,'源码没有提供可靠的文件作用说明。')+facts+section('在 '+C.length+' 个主要功能中的作用','<div class="core-grid">'+roles+'</div>','这个文件不直接参与已识别的主要功能。')+section('主要函数、类型和变量',symbols?'<ul class="detail-list">'+symbols+'</ul>':'','没有发现适合向新手解释的主要声明；低置信度的内部辅助代码没有硬猜。')+section('直接涉及的数据表',tables?'<ul class="detail-list">'+tables+'</ul>':'','源码没有直接读取、写入、定义或迁移数据表。')+section('注册的 HTTP 路由',routes?'<ul class="detail-list">'+routes+'</ul>':'','这个文件没有直接注册 HTTP 路由。')+section('为什么要使用其他模块',deps?'<ul class="detail-list">'+deps+'</ul>':'','没有发现需要单独解释的跨模块依赖。')+section('源码设计说明',notes?'<ul class="detail-list">'+notes+'</ul>':'','源码没有留下需要额外说明的设计注释。')+section('主要测试场景',tests?'<ul class="detail-list">'+tests+'</ul>':'','没有找到直接针对这个文件行为的测试场景。'))}function glossary(){const caps=C.map(c=>'<div class="core-card"><div class="core-head"><b>'+esc(c.name)+'</b><span class="role direct">核心能力</span></div><p>'+esc(c.summary||c.outcome)+'</p></div>').join(''),mods=Object.entries(D.modules||{}).map(([k,m])=>'<div class="gloss-item"><b>'+esc(m.name||k)+'</b><div>'+esc(m.owns||m.description)+'</div>'+(m.usedFor?'<small>其他模块使用它：'+esc(m.usedFor)+'</small>':'')+'</div>').join(''),terms=(D.glossary||[]).map(t=>'<div class="gloss-item"><b>'+esc(t.code||t.name)+'</b><div>'+esc(t.meaning||t.description)+'</div></div>').join('');openDrawer('核心能力、模块与名词','<h3>核心用户能力</h3><div class="core-grid">'+caps+'</div><h3>中英文模块说明</h3>'+mods+terms)}document.addEventListener('click',e=>{const b=e.target.closest('[data-path],[data-file]');if(!b)return;if(b.dataset.path!==undefined)render(b.dataset.path);if(b.dataset.file)file(b.dataset.file)});document.getElementById('glossary-open').onclick=glossary;document.getElementById('close').onclick=close;document.getElementById('backdrop').onclick=close;const input=document.getElementById('search'),results=document.getElementById('search-results');input.oninput=()=>{const q=input.value.trim().toLowerCase();if(!q){results.classList.remove('open');return}const found=Object.entries(E).filter(([p,x])=>[p,x.display,x.description,...(x.symbolDetails||[]).flatMap(s=>[s.name,s.description]),...(x.coreRoles||[]).flatMap(r=>[r.name,r.description])].join(' ').toLowerCase().includes(q)).slice(0,80);results.innerHTML=found.map(([p,x])=>'<button class="result" data-'+(x.kind==='dir'?'path':'file')+'="'+esc(p)+'"><b>'+esc(x.display||p)+'</b><small>'+esc(x.description||'')+'</small></button>').join('')||'<div class="empty">没有匹配结果</div>';results.classList.add('open')};results.onclick=()=>results.classList.remove('open');topDirs();const initial=decodeURIComponent(location.hash.replace(/^#\/?/,''));render(E[initial]?.kind==='dir'?initial:'')})();
